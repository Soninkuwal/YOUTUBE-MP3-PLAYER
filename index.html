<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuwal Music - Listen to Free Music, Hits & Songs Online</title>
  <link rel="shortcut icon" href="logo.png">
  
  <meta name="description" content="Kuwal Music par suniye latest trending songs, top artists, romantic tracks aur fresh hits. Enjoy uninterrupted streaming and online music player.">
  <meta name="keywords" content="Kuwal Music, free songs, online music player, hindi songs, trending music, top artists">
  <meta name="author" content="Kuwal Music">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="music.song">
  <meta property="og:site_name" content="Kuwal Music">
  <meta property="og:title" content="Kuwal Music - Free Music Streaming">
  <meta property="og:description" content="Stream the best songs, trending hits, and music playlists online.">
  <meta property="og:image" content="logo.png">
  <meta property="og:url" content="https://kuwal-music.pages.dev/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kuwal Music - Free Online Songs">
  <meta name="twitter:description" content="Stream and play top songs seamlessly.">
  <meta name="twitter:image" content="logo.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    header {
      position: sticky; top: 0; background: #fff; z-index: 10;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: #111; }
    .brand a { display: flex; align-items: center; text-decoration: none; }
    .brand img { height: 44px; width: 44px; object-fit: contain; }

    .search-section { padding: 16px; background: #fff; border-bottom: 1px solid #edf2f7; }
    .search-box {
      display: flex; align-items: center; background: #f1f5f9;
      border-radius: 25px; padding: 8px 16px; gap: 10px;
    }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 0.95rem; }
    
    .direct-input-box { margin-top: 10px; display: flex; gap: 8px; }
    .direct-input-box input { flex: 1; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; outline: none; }
    .direct-input-box button { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    .section-title { font-size: 1.15rem; font-weight: 700; padding: 18px 16px 8px; display: flex; justify-content: space-between; align-items: center; }
    .view-all-btn { font-size: 0.8rem; background: #f1f5f9; color: var(--text); border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 14px; cursor: pointer; }
    .view-all-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    .horizontal-scroll { display: flex; overflow-x: auto; gap: 14px; padding: 0 16px 12px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    
    .song-card { min-width: 130px; max-width: 130px; position: relative; cursor: pointer; }
    .thumb-wrapper { position: relative; width: 130px; height: 130px; border-radius: 12px; overflow: hidden; background: #e2e8f0; }
    .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-wrapper .play-overlay {
      position: absolute; bottom: 6px; right: 6px; background: rgba(0, 0, 0, 0.7);
      color: #fff; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
    }
    .song-title { font-size: 0.85rem; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .song-artist { font-size: 0.75rem; color: var(--subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Artist Circular Cards */
    .artist-card { min-width: 90px; max-width: 90px; text-align: center; cursor: pointer; }
    .artist-thumb { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 6px; background: #e2e8f0; border: 2px solid var(--primary); }
    .artist-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .artist-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Library Screen */
    #librarySection { display: none; padding: 16px; }
    .playlist-item {
      background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer;
    }
    .playlist-info h4 { font-size: 1rem; color: #1e293b; }
    .playlist-info p { font-size: 0.8rem; color: var(--subtext); }

    /* Detail / All Songs View */
    #detailSectionView { display: none; padding: 16px; }
    .song-list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid #e2e8f0; cursor: pointer;
    }
    .song-item-info { display: flex; align-items: center; gap: 12px; }
    .song-item-info img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }

    /* Mini Player */
    .mini-player {
      position: fixed; bottom: 58px; left: 0; right: 0; background: #1e293b;
      color: #fff; display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; z-index: 99; cursor: pointer;
    }
    .mini-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .mini-info img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    .mini-text { overflow: hidden; }
    .mini-text h4 { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-text p { font-size: 0.7rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-controls { display: flex; gap: 16px; font-size: 1.2rem; align-items: center; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff; height: 58px;
      display: flex; border-top: 1px solid #e2e8f0; z-index: 100;
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--subtext); text-decoration: none; gap: 3px; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .nav-item i { font-size: 1rem; }

    /* Custom Toast */
    .custom-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-30px);
      background: #1e293b; color: #fff; padding: 12px 22px; border-radius: 30px;
      font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25); opacity: 0; pointer-events: none;
      transition: all 0.3s ease; z-index: 9999;
    }
    .custom-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Hidden YouTube Player for Home Screen Background Play */
    #homeAudioFrameContainer {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div class="custom-toast" id="customToast">
    <i class="fa-solid fa-circle-info" style="color:var(--primary);"></i>
    <span id="toastMessage">Notification</span>
  </div>

  <!-- Hidden Container for in-home playback -->
  <div id="homeAudioFrameContainer"></div>

  <header>
    <div class="brand">
      <a href="index1.html" aria-label="Kuwal Music Home">
        <img src="logo.png" alt="Kuwal Music Logo" onerror="this.src='https://via.placeholder.com/48?text=KM'">
      </a>
      <span>Kuwal Music</span>
    </div>
  </header>

  <div class="search-section" id="searchBarWrapper">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" style="color:#64748b;"></i>
      <input type="text" id="searchInput" placeholder="Search song, category, or artist..." oninput="handleSearch()">
    </div>
    <div class="direct-input-box">
      <input type="text" id="directUrl" placeholder="Paste YouTube link or ID">
      <button onclick="playDirectUrl()"><i class="fa-solid fa-play"></i> Play</button>
    </div>
  </div>

  <!-- Main View: Dynamic Categories & Artists -->
  <div id="contentSections">
    <!-- Top Artists Section -->
    <div class="section-title">
      <span>Top Artists</span>
    </div>
    <div class="horizontal-scroll" id="artistList"></div>

    <!-- Container where dynamic randomized categories will render -->
    <div id="categoriesContainer"></div>
  </div>

  <!-- All Songs / Category / Artist Detail View -->
  <div id="detailSectionView">
    <button onclick="closeDetailView()" style="border:none; background:none; color:var(--primary); font-weight:bold; margin-bottom:15px; cursor:pointer;">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </button>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="detailTitle">Category Songs</h2>
      <button onclick="playAllInDetail()" style="padding:6px 14px; background:var(--primary); color:#fff; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">
        <i class="fa-solid fa-play"></i> Play All
      </button>
    </div>
    <div id="detailSongsList" style="margin-top:15px;"></div>
  </div>

  <!-- My Library View -->
  <div id="librarySection">
    <h2 style="margin-bottom:14px;">My Playlists</h2>
    <div id="allPlaylistsContainer"></div>
  </div>

  <!-- Mini Player (Home Page Play/Pause) -->
  <div class="mini-player" id="miniPlayer" onclick="openPlayerPage()">
    <div class="mini-info">
      <img id="miniThumb" src="https://via.placeholder.com/40" alt="Thumb">
      <div class="mini-text">
        <h4 id="miniTitle">No Song</h4>
        <p id="miniArtist">Select to play</p>
      </div>
    </div>
    <div class="mini-controls" onclick="event.stopPropagation()">
      <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
      <i class="fa-solid fa-circle-play" id="miniPlayIcon" onclick="togglePlay()"></i>
      <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="navMusic" onclick="switchTab('music')"><i class="fa-solid fa-music"></i><span>Music</span></div>
    <div class="nav-item" id="navLibrary" onclick="switchTab('library')"><i class="fa-solid fa-user"></i><span>My Library</span></div>
  </nav>

  <script>
    // Songs Database (Supports multiple categories in array)
    let songsDatabase = [
      { id: "B2KFkSkNllo", title: "", artist: "", type: "yt", ytId: "B2KFkSkNllo", categories: ["Recently Played", "Trending Hits"] },
      { id: "aBPIfN5fHO4", title: "Blank Space", artist: "Taylor Swift", type: "yt", ytId: "aBPIfN5fHO4", categories: ["Recently Played", "English Pop"] },
      { id: "fKopy74weus", title: "Girlfriend", artist: "Jass Manak", type: "yt", ytId: "fKopy74weus", categories: ["Fresh Hits", "Punjabi Vibes"] },
      { id: "k4yXQkGLeAA", title: "Paaro", artist: "Aditya Rikhari", type: "yt", ytId: "k4yXQkGLeAA", categories: ["Fresh Hits", "Indie Melodies"] },
      { id: "kJQP7kiw5Fk", title: "Despacito", artist: "Luis Fonsi", type: "yt", ytId: "kJQP7kiw5Fk", categories: ["Top Genres & Moods", "Trending Hits"] }
    ];

    let currentPlaylistSongs = [];
    let currentSongIndex = 0;
    let isMiniPlaying = false;
    let activeSong = null;
    let ytIframePlayer = null;

    function showToast(message) {
      const toast = document.getElementById('customToast');
      document.getElementById('toastMessage').innerText = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Auto-fetch missing title, artist & thumbnail via YouTube oEmbed
    async function autoFetchYouTubeDetails() {
      for (let song of songsDatabase) {
        if (!song.title || !song.artist) {
          try {
            const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${song.ytId}`);
            const data = await res.json();
            if (data.title) {
              if (!song.title) song.title = data.title;
              if (!song.artist) song.artist = data.author_name || "Unknown Artist";
            }
          } catch (e) {
            if (!song.title) song.title = "YouTube Track " + song.ytId;
            if (!song.artist) song.artist = "Kuwal Artist";
          }
        }
      }
      renderAllComponents();
    }

    // Shuffle Array for Random Category Positions on each load
    function shuffleArray(arr) {
      let shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function renderAllComponents() {
      renderArtists();
      renderCategories();
    }

    // Dynamic Artist Generation
    function renderArtists() {
      const artistContainer = document.getElementById('artistList');
      artistContainer.innerHTML = '';
      
      const artistMap = {};
      songsDatabase.forEach(song => {
        const artist = song.artist || "Kuwal Artist";
        if (!artistMap[artist]) {
          artistMap[artist] = {
            name: artist,
            thumb: `https://i.ytimg.com/vi/${song.ytId}/hqdefault.jpg`,
            songs: []
          };
        }
        artistMap[artist].songs.push(song);
      });

      Object.values(artistMap).forEach(art => {
        const card = document.createElement('div');
        card.className = 'artist-card';
        card.onclick = () => openArtistDetail(art.name);
        card.innerHTML = `
          <div class="artist-thumb">
            <img src="${art.thumb}" alt="${art.name}">
          </div>
          <div class="artist-name">${art.name}</div>
        `;
        artistContainer.appendChild(card);
      });
    }

    // Dynamic Category Sections with Shuffle Position
    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      // Collect all unique categories
      const allCategoriesSet = new Set();
      songsDatabase.forEach(s => {
        (s.categories || []).forEach(cat => allCategoriesSet.add(cat));
      });

      // Shuffle categories so every refresh alters position
      const categories = shuffleArray(Array.from(allCategoriesSet));

      categories.forEach(category => {
        const matchingSongs = songsDatabase.filter(s => s.categories && s.categories.includes(category));
        if (matchingSongs.length === 0) return;

        const section = document.createElement('div');
        section.className = 'category-section-block';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'section-title';
        headerDiv.innerHTML = `
          <span>${category}</span>
          <button class="view-all-btn" onclick="openCategoryDetail('${category}')">
            <i class="fa-solid fa-list"></i> All Songs
          </button>
        `;

        const scrollDiv = document.createElement('div');
        scrollDiv.className = 'horizontal-scroll';

        matchingSongs.forEach(song => {
          const thumb = `https://i.ytimg.com/vi/${song.ytId}/hqdefault.jpg`;
          const songCard = document.createElement('div');
          songCard.className = 'song-card';
          // Click to play directly on home page
          songCard.onclick = () => playSongOnHomePage(song, matchingSongs);
          songCard.innerHTML = `
            <div class="thumb-wrapper">
              <img src="${thumb}" alt="${song.title}">
              <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          `;
          scrollDiv.appendChild(songCard);
        });

        section.appendChild(headerDiv);
        section.appendChild(scrollDiv);
        container.appendChild(section);
      });
    }

    // Play song directly on Home Page
    function playSongOnHomePage(song, playlist = null) {
      activeSong = song;
      currentPlaylistSongs = playlist || songsDatabase;
      currentSongIndex = currentPlaylistSongs.findIndex(s => s.ytId === song.ytId);
      if (currentSongIndex === -1) currentSongIndex = 0;

      localStorage.setItem('activeSong', JSON.stringify(song));
      localStorage.setItem('playlist', JSON.stringify(currentPlaylistSongs));
      localStorage.setItem('currentSongIndex', currentSongIndex);

      updateMiniPlayer(song);
      startHomePlayback(song.ytId);
      isMiniPlaying = true;
      document.getElementById('miniPlayIcon').className = "fa-solid fa-circle-pause";
      showToast(`Playing: ${song.title}`);
    }

    function startHomePlayback(ytId) {
      const container = document.getElementById('homeAudioFrameContainer');
      container.innerHTML = `<iframe id="ytPlayerFrame" src="https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1" allow="autoplay"></iframe>`;
    }

    function updateMiniPlayer(song) {
      if (!song) return;
      document.getElementById('miniTitle').innerText = song.title || "Unknown Title";
      document.getElementById('miniArtist').innerText = song.artist || "Kuwal Music";
      document.getElementById('miniThumb').src = `https://i.ytimg.com/vi/${song.ytId}/hqdefault.jpg`;
    }

    function togglePlay() {
      if (!activeSong) {
        if (songsDatabase.length > 0) playSongOnHomePage(songsDatabase[0]);
        return;
      }
      isMiniPlaying = !isMiniPlaying;
      const icon = document.getElementById('miniPlayIcon');
      if (isMiniPlaying) {
        icon.className = "fa-solid fa-circle-pause";
        startHomePlayback(activeSong.ytId);
      } else {
        icon.className = "fa-solid fa-circle-play";
        document.getElementById('homeAudioFrameContainer').innerHTML = ''; // Stop audio
      }
    }

    function nextSong() {
      const queue = currentPlaylistSongs.length ? currentPlaylistSongs : songsDatabase;
      currentSongIndex = (currentSongIndex + 1) % queue.length;
      playSongOnHomePage(queue[currentSongIndex], queue);
    }

    function prevSong() {
      const queue = currentPlaylistSongs.length ? currentPlaylistSongs : songsDatabase;
      currentSongIndex = (currentSongIndex - 1 + queue.length) % queue.length;
      playSongOnHomePage(queue[currentSongIndex], queue);
    }

    // Open standalone player.html
    function openPlayerPage(song = null) {
      if (song) {
        localStorage.setItem('activeSong', JSON.stringify(song));
      }
      window.location.href = 'player.html';
    }

    // Category Detail View with All Songs
    function openCategoryDetail(categoryName) {
      const songs = songsDatabase.filter(s => s.categories && s.categories.includes(categoryName));
      showDetailedList(categoryName, songs);
    }

    // Artist Detail View with All Songs
    function openArtistDetail(artistName) {
      const songs = songsDatabase.filter(s => s.artist === artistName);
      showDetailedList(`Artist: ${artistName}`, songs);
    }

    let activeDetailSongs = [];
    function showDetailedList(title, songs) {
      activeDetailSongs = songs;
      document.getElementById('contentSections').style.display = 'none';
      document.getElementById('searchBarWrapper').style.display = 'none';
      document.getElementById('librarySection').style.display = 'none';
      document.getElementById('detailSectionView').style.display = 'block';

      document.getElementById('detailTitle').innerText = title;
      const listContainer = document.getElementById('detailSongsList');
      listContainer.innerHTML = '';

      if (songs.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--subtext)">No songs found.</p>';
        return;
      }

      songs.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = 'song-list-item';
        // Clicking specific song redirects to player.html as requested
        item.onclick = () => {
          localStorage.setItem('activeSong', JSON.stringify(song));
          localStorage.setItem('playlist', JSON.stringify(songs));
          localStorage.setItem('currentSongIndex', idx);
          openPlayerPage(song);
        };

        item.innerHTML = `
          <div class="song-item-info">
            <img src="https://i.ytimg.com/vi/${song.ytId}/hqdefault.jpg" alt="${song.title}">
            <div>
              <div style="font-weight:600; font-size:0.9rem;">${song.title}</div>
              <div style="font-size:0.75rem; color:var(--subtext);">${song.artist}</div>
            </div>
          </div>
          <i class="fa-solid fa-play" style="color:var(--primary); font-size:1.1rem; padding-right:10px;"></i>
        `;
        listContainer.appendChild(item);
      });
    }

    function playAllInDetail() {
      if (activeDetailSongs.length > 0) {
        // Play whole playlist and redirect to player.html
        localStorage.setItem('activeSong', JSON.stringify(activeDetailSongs[0]));
        localStorage.setItem('playlist', JSON.stringify(activeDetailSongs));
        localStorage.setItem('currentSongIndex', 0);
        openPlayerPage(activeDetailSongs[0]);
      }
    }

    function closeDetailView() {
      document.getElementById('detailSectionView').style.display = 'none';
      document.getElementById('contentSections').style.display = 'block';
      document.getElementById('searchBarWrapper').style.display = 'block';
    }

    // Adding dynamic category/song
    function addNewSongWithCategory(ytId, categories = ["New Arrivals"]) {
      const newSong = { id: ytId, ytId: ytId, title: "", artist: "", categories: categories };
      songsDatabase.push(newSong);
      autoFetchYouTubeDetails();
    }

    function playDirectUrl() {
      const url = document.getElementById('directUrl').value.trim();
      if (!url) {
        showToast('Please enter a valid URL!');
        return;
      }
      let ytId = extractYouTubeID(url);
      if (!ytId) {
        showToast('Invalid YouTube Link/ID');
        return;
      }
      addNewSongWithCategory(ytId, ["Trending Hits"]);
      playSongOnHomePage(songsDatabase[songsDatabase.length - 1]);
    }

    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null);
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.song-card, .artist-card');
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? 'inline-block' : 'none';
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('contentSections').style.display = 'none';
      document.getElementById('librarySection').style.display = 'none';
      document.getElementById('detailSectionView').style.display = 'none';
      document.getElementById('searchBarWrapper').style.display = 'none';

      if (tab === 'music') {
        document.getElementById('navMusic').classList.add('active');
        document.getElementById('contentSections').style.display = 'block';
        document.getElementById('searchBarWrapper').style.display = 'block';
      } else if (tab === 'library') {
        document.getElementById('navLibrary').classList.add('active');
        document.getElementById('librarySection').style.display = 'block';
        renderPlaylists();
      }
    }

    function renderPlaylists() {
      const playlists = JSON.parse(localStorage.getItem('myPlaylists')) || {
        "Favorites": [songsDatabase[0], songsDatabase[1]]
      };
      const container = document.getElementById('allPlaylistsContainer');
      container.innerHTML = '';
      
      const names = Object.keys(playlists);
      if (names.length === 0) {
        container.innerHTML = '<p style="color:#64748b; margin-top:20px;">No playlists found.</p>';
        return;
      }

      names.forEach(name => {
        const count = playlists[name].length;
        container.innerHTML += `
          <div class="playlist-item" onclick="showDetailedList('${name}', JSON.parse(localStorage.getItem('myPlaylists'))['${name}'])">
            <div class="playlist-info">
              <h4><i class="fa-solid fa-list-music" style="color:var(--primary); margin-right:8px;"></i> ${name}</h4>
              <p>${count} Songs</p>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:#94a3b8;"></i>
          </div>
        `;
      });
    }

    window.onload = () => {
      autoFetchYouTubeDetails();
      const savedSong = JSON.parse(localStorage.getItem('activeSong')) || songsDatabase[0];
      if (savedSong) {
        activeSong = savedSong;
        updateMiniPlayer(savedSong);
      }
    };
  </script>
</body>
</html>
